[package]
name = "longan_nano_rs"
version = "0.1.0"
authors = ["Sergey Matyukevich <geomatsi@gmail.com>"]
edition = "2021"

autobins = false
autotests = false
autoexamples = false

[dependencies]
riscv-rt = "0.11.0"
panic-halt = "0.2.0"
gd32vf103xx-hal = "0.5.0"
critical-section = "1.1.1"
embedded-graphics = "0.7.1"
rotary-encoder-embedded = "0.5.0"
embedded-hal-compat = "0.13.0"
heapless = "0.9.2"

si5351 = "0.2.0"
bitbang-hal = "0.3.3"

[dependencies.riscv]
version = "0.10.1"
features = ["critical-section-single-hart"]

[dependencies.longan-nano]
version = "0.3"
features = ["lcd"]

# bins

[[bin]]
name = "blink"
path = "src/bin/blink.rs"

[[bin]]
name = "ball"
path = "src/bin/ball.rs"

[[bin]]
name = "text"
path = "src/bin/text.rs"

[[bin]]
name = "encoder"
path = "src/bin/encoder.rs"

[[bin]]
name = "cw"
path = "src/bin/cw.rs"

[[bin]]
name = "signal"
path = "src/bin/signal.rs"

# examples

[[example]]
name = "uart-test1"
path = "examples/uart-test1.rs"

[[example]]
name = "irq-test1"
path = "examples/irq-test1.rs"
