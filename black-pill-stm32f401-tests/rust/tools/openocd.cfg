# For JLink:
#source [find interface/jlink.cfg]
#transport select swd
#adapter speed 1000

# For STLink:
source [find interface/stlink.cfg]
adapter speed 2000

source [find target/stm32f4x.cfg]

proc attach () {
	init
	reset halt
}

proc flash_img { image } {
	init
	program $image verify reset exit
}
